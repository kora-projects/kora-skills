# One property drives both the kora-bom platform and the KSP processor.
# 2.0.0.RC2 is the current 2.0.x release on Maven Central and resolves from plain
# mavenCentral(). Do not put 2.0.0-SNAPSHOT here: that is the master development
# line and needs the snapshot repository or a local publishToMavenLocal.
koraVersion=2.0.0.RC2
junitVersion=6.1.3

# Let Gradle find or download the JDK requested by the toolchain.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# Kotlin cannot always target a brand-new JDK exactly; report the fallback
# as a warning instead of failing the build.
kotlin.jvm.target.validation.mode=warning

# Kora's processors read repository and controller interfaces. On an incremental
# build they may see a class file whose parameter names are synthetic and report
# e.g. "SQL query placeholder has no matching method parameter: :id / - :arg0"
# against correct source. Re-enable this only if you are ready to reach for
# --rerun-tasks whenever a processor complains about something the source has.
kotlin.incremental=false

org.gradle.jvmargs=-Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
